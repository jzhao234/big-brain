name: Bug report
description: Something big-brain did wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove anything private from notes before you paste them. Security problems go through SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command or MCP tool call, plus the smallest note content that shows the problem.
      render: markdown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: big-brain version
      description: Output of `big-brain --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node version, and AI client
      placeholder: macOS 15, Node 22, Claude Desktop
  - type: checkboxes
    id: obsidian
    attributes:
      label: Vault
      options:
        - label: The vault is also opened in Obsidian
