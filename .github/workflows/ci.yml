name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The default install includes platform helpers used by the test runner,
      # but excludes the opt-in Transformers add-on and its native dependency tree.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-test CLI
        run: |
          node dist/cli/index.js init /tmp/smoke-vault --name Smoke
          cd /tmp/smoke-vault
          node "$GITHUB_WORKSPACE/dist/cli/index.js" status
          node "$GITHUB_WORKSPACE/dist/cli/index.js" doctor || true

  # Proves the published default: embeddings stay opt-in while the package
  # still typechecks and builds without Transformers installed.
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify embeddings dependency is not installed by default
        run: test ! -d node_modules/@huggingface/transformers
      - run: npm run typecheck
      - run: npm run build
