name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The default install includes platform helpers used by the test runner,
      # but excludes the opt-in Transformers add-on and its native dependency tree.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-test CLI
        run: |
          node dist/cli/index.js init /tmp/smoke-vault --name Smoke
          cd /tmp/smoke-vault
          node "$GITHUB_WORKSPACE/dist/cli/index.js" status
          node "$GITHUB_WORKSPACE/dist/cli/index.js" doctor || true

  # Proves the published default: embeddings stay opt-in while the package
  # still typechecks and builds without Transformers installed.
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify embeddings dependency is not installed by default
        run: test ! -d node_modules/@huggingface/transformers
      - run: npm run typecheck
      - run: npm run build

  # Installs the packed tarball the way `npm install -g @jzhao234/big-brain` would, so a
  # missing file in "files" or a broken bin fails here instead of after publish.
  packed-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack
      - run: npm install -g ./jzhao234-big-brain-*.tgz
      - name: Smoke-test the installed commands
        run: |
          big-brain --version
          big-brain init /tmp/packed-vault --name Packed
          big-brain --vault /tmp/packed-vault status
          big-brain setup /tmp/setup-vault --no-claude --no-codex
          test -f /tmp/setup-vault/brain.config.json
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          echo "$init" | big-brain-mcp --vault /tmp/packed-vault | grep -q '"name":"big-brain"'
          echo "$init" | BIG_BRAIN_VAULT=/tmp/packed-vault big-brain mcp | grep -q '"name":"big-brain"'
          # The registry entry runs `npx @jzhao234/big-brain mcp`: npx must pick the big-brain bin.
          tgz=$(ls "$GITHUB_WORKSPACE"/jzhao234-big-brain-*.tgz)
          echo "$init" | BIG_BRAIN_VAULT=/tmp/packed-vault npx -y "file:$tgz" mcp | grep -q '"name":"big-brain"'
